<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Insta AIO Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Local companion</p>
      <h1>Pair this tab</h1>
      <p id="active-origin">Open the PWA in this tab before pairing.</p>
    </header>

    <form id="pairing-form">
      <label for="pairing-code">One-time pairing code</label>
      <textarea id="pairing-code" rows="3" spellcheck="false" autocomplete="off" required></textarea>
      <label class="check">
        <input id="action-permission" type="checkbox">
        Allow reviewed dry-run job transfer
      </label>
      <button type="submit">Pair exact origin</button>
    </form>

    <p class="notice">Live Follow, Unfollow, and Unsend clicks are disabled in this extension build. Instagram cookies never leave the browser.</p>
    <div id="status" role="status" aria-live="polite"></div>
    <section aria-labelledby="pairings-heading">
      <h2 id="pairings-heading">Saved pairings</h2>
      <div id="pairings"></div>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
