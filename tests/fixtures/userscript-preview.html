<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insta Toolbox userscript runtime fixture</title>
  <style>
    :root {
      --ig-primary-background: 255 255 255;
      --ig-elevated-background: 255 255 255;
      --ig-secondary-background: 250 250 250;
      --ig-primary-text: 0 0 0;
      --ig-secondary-text: 115 115 115;
      --ig-separator: 219 219 219;
      --ig-primary-button: 0 149 246;
      color-scheme: light;
    }
    body { margin: 0; background: rgb(var(--ig-secondary-background)); color: rgb(var(--ig-primary-text)); font: 14px/1.4 system-ui, sans-serif; }
    main { width: min(760px, calc(100vw - 40px)); margin: 40px auto; }
    header { padding: 24px; border: 1px solid rgb(var(--ig-separator)); background: rgb(var(--ig-elevated-background)); }
    header h1 { display: inline; margin-right: 18px; font-size: 20px; }
    button { padding: 8px 14px; }
    [role="dialog"] { width: 320px; margin-top: 20px; padding: 16px; border: 1px solid rgb(var(--ig-separator)); background: rgb(var(--ig-elevated-background)); }
    [role="dialog"] a { display: block; padding: 7px 0; color: inherit; }
    [role="row"] { max-width: 70%; margin: 14px 0; padding: 10px; border-radius: 12px; background: #eee; }
    [data-sent-by-me="true"] { margin-left: auto; background: #2884e8; color: #fff; }
    @media (prefers-color-scheme: dark) {
      :root {
        --ig-primary-background: 0 0 0;
        --ig-elevated-background: 38 38 38;
        --ig-secondary-background: 18 18 18;
        --ig-primary-text: 245 245 245;
        --ig-secondary-text: 168 168 168;
        --ig-separator: 54 54 54;
        color-scheme: dark;
      }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>demo_creator</h1><button id="relationship" type="button">Following</button></header>
    <section role="dialog" aria-label="Following"><h2>Following</h2><a href="/mutual_friend/">mutual_friend</a><a href="/not_back/">not_back</a></section>
  </main>
  <script>
    const partialRunFixture = new URLSearchParams(location.search).has('partial-run');
    globalThis.fixtureProfileClickCount = 0;
    globalThis.fixtureUnsentCount = 0;
    globalThis.fixtureConfirmMessage = '';
    document.querySelector('#relationship').addEventListener('click', () => { globalThis.fixtureProfileClickCount += 1; });
    history.replaceState({}, '', '/demo_creator/');
    const dmText = 'Yes — reviewing it now.';
    let dmHash = 0x811c9dc5;
    for (let index = 0; index < dmText.length; index += 1) {
      dmHash ^= dmText.charCodeAt(index);
      dmHash = Math.imul(dmHash, 0x01000193);
    }
    const dmTarget = {
      conversationId: 'inbox/studio_friend_123',
      contentDigest: (dmHash >>> 0).toString(16).padStart(8, '0'),
      messageId: 'sent-1',
      sentByMe: true,
      timestamp: 1700000000100,
    };
    globalThis.fixtureGmStore = {
      instaToolboxUserscriptStateV2: {
        schemaVersion: 2,
        capture: { followers: [], following: [], capturedAt: { followers: null, following: null } },
        queue: {
          importedAt: '2026-08-04T00:00:00.000Z',
          queue: [{
            id: 'fixture-queue-1',
            account: { username: 'demo_creator', displayName: 'Demo Creator' },
            action: 'unfollow',
            status: 'ready',
            reason: 'fixture review',
          }],
        },
        dmTarget,
        history: [],
      },
    };
    globalThis.GM_getValue = (key, fallback) => structuredClone(
      Object.hasOwn(globalThis.fixtureGmStore, key) ? globalThis.fixtureGmStore[key] : fallback,
    );
    if (partialRunFixture) {
      const profile = document.createElement('a');
      profile.href = '/demo_creator/';
      profile.setAttribute('aria-label', 'Profile');
      document.body.append(profile);
      Object.assign(globalThis.fixtureGmStore.instaToolboxUserscriptStateV2, {
        schemaVersion: 6,
        capture: {
          subjectUsername: 'demo_creator',
          followers: [{ username: 'mutual_friend' }, { username: 'follower_only' }],
          following: [{ username: 'mutual_friend' }, { username: 'not_back' }],
          complete: { followers: false, following: true },
          verified: { followers: true, following: true },
          capturedAt: { followers: '2026-09-12T00:00:00.000Z', following: '2026-09-12T00:00:00.000Z' },
        },
      });
    }
    globalThis.GM_setValue = (key, value) => {
      globalThis.fixtureGmStore[key] = structuredClone(value);
    };
    globalThis.fixtureDownloads = [];
    const fixtureBlobs = new Map();
    let fixtureBlobId = 0;
    URL.createObjectURL = (blob) => {
      const url = `blob:https://www.instagram.com/insta-toolbox-${fixtureBlobId += 1}`;
      fixtureBlobs.set(url, blob);
      return url;
    };
    URL.revokeObjectURL = (url) => fixtureBlobs.delete(url);
    const nativeAnchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function fixtureAnchorClick() {
      const blob = fixtureBlobs.get(this.href);
      if (this.download && blob) {
        globalThis.fixtureDownloads.push({ blob, filename: this.download });
        return;
      }
      nativeAnchorClick.call(this);
    };
    globalThis.fixtureSetList = (type, customValues = null) => {
      const dialog = document.querySelector('[role="dialog"]');
      dialog.setAttribute('aria-label', type === 'followers' ? 'Followers' : 'Following');
      dialog.querySelector('h2').textContent = type === 'followers' ? 'Followers' : 'Following';
      dialog.querySelectorAll('a').forEach((element) => element.remove());
      const values = Array.isArray(customValues)
        ? customValues
        : type === 'followers'
          ? ['mutual_friend', 'follower_only']
          : ['mutual_friend', 'not_back'];
      let counter = document.querySelector(`[data-fixture-count="${type}"]`);
      if (!counter) {
        counter = document.createElement('a');
        counter.href = '#';
        counter.dataset.fixtureCount = type;
        document.querySelector('header').append(counter);
      }
      counter.textContent = `${values.length} ${type}`;
      for (const value of values) {
        const username = typeof value === 'string' ? value : value.username;
        const anchor = document.createElement('a');
        anchor.href = `/${username}/`;
        anchor.textContent = typeof value === 'string' ? username : value.displayName || username;
        dialog.append(anchor);
      }
    };
    globalThis.fixtureSetMessages = () => {
      history.replaceState({}, '', '/direct/t/123/');
      document.querySelector('main').innerHTML = `
        <section data-pagelet="IGDMessagesList">
          <header><h1>studio_friend</h1></header>
          <div role="row" data-message-id="received-1" data-timestamp-ms="1700000000000" data-sent-by-me="false"><div dir="auto">Did you see the draft?</div></div>
          <div id="fixture-sent-row" role="row" data-message-id="sent-1" data-timestamp-ms="1700000000100" data-sent-by-me="true"><div data-insta-toolbox-message-content dir="auto">${dmText}</div><div id="fixture-message-options" role="button">See more options for message from demo_creator</div></div>
        </section>
        <div id="fixture-menu" hidden></div>`;
      const row = document.querySelector('#fixture-sent-row');
      const menu = document.querySelector('#fixture-menu');
      document.querySelector('#fixture-message-options').addEventListener('click', () => {
        menu.hidden = false;
        menu.replaceChildren();
        const choice = document.createElement('div');
        choice.setAttribute('role', 'button');
        choice.textContent = 'Unsend';
        choice.addEventListener('click', () => {
          menu.hidden = true;
          const dialog = document.createElement('div');
          dialog.setAttribute('role', 'dialog');
          const cancel = document.createElement('button');
          cancel.textContent = 'Cancel';
          const confirm = document.createElement('button');
          confirm.textContent = 'Unsend';
          confirm.addEventListener('click', () => {
            dialog.remove();
            row.replaceChildren();
            const note = document.createElement('div');
            note.setAttribute('dir', 'auto');
            note.textContent = 'You unsent a message';
            row.append(note);
            row.removeAttribute('data-sent-by-me');
            globalThis.fixtureUnsentCount += 1;
          });
          dialog.append(cancel, confirm);
          document.body.append(dialog);
        });
        menu.append(choice);
      });
    };
  </script>
  <script src="/userscripts/insta-toolbox.user.js"></script>
  <script src="/userscripts/insta-toolbox.user.js"></script>
</body>
</html>
