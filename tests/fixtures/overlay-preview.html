<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insta AIO overlay runtime fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafafa; color: #111; font: 14px/1.4 system-ui, sans-serif; }
    .instagram-shell { display: grid; min-height: 100vh; grid-template-columns: 244px minmax(0, 1fr); }
    .instagram-nav { padding: 34px 24px; border-right: 1px solid #ddd; background: #fff; }
    .instagram-nav strong { font: 28px cursive; }
    .instagram-nav ul { display: grid; gap: 28px; margin: 44px 0; padding: 0; list-style: none; }
    main { width: min(880px, calc(100vw - 300px)); margin: 0 auto; padding: 58px 34px; }
    .profile { display: grid; grid-template-columns: 180px 1fr; gap: 44px; align-items: center; }
    .avatar { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(145deg, #f7be45, #e54b88 52%, #7653db); }
    .profile h1 { display: inline; margin-right: 18px; font-size: 20px; font-weight: 500; }
    .profile button { border: 0; border-radius: 8px; padding: 8px 18px; background: #efefef; font-weight: 650; }
    .stats { display: flex; gap: 34px; margin: 24px 0; }
    .feed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 50px; border-top: 1px solid #ddd; padding-top: 34px; }
    .post { aspect-ratio: 1; background: #d8d5cf; }
    .fixture-dialog { position: fixed; left: 280px; bottom: 28px; width: 310px; padding: 14px; border: 1px solid #bbb; border-radius: 12px; background: #fff; box-shadow: 0 18px 50px rgba(0,0,0,.2); }
    .fixture-dialog h2 { margin: 0 0 10px; font-size: 15px; }
    .fixture-dialog a { display: block; padding: 7px 0; color: #111; text-decoration: none; }
    .fixture-thread { width: min(640px, 100%); margin: 0 auto; border: 1px solid #ddd; background: #fff; }
    .fixture-thread header { padding: 18px; border-bottom: 1px solid #ddd; }
    .fixture-thread header h1 { margin: 0; font-size: 16px; }
    .fixture-thread [role="row"] { max-width: 72%; margin: 18px; padding: 11px 14px; border-radius: 16px; background: #efefef; }
    .fixture-thread [data-mine] { margin-left: auto; background: #3e8df5; color: #fff; }
    .fixture-live-confirmation, .fixture-native-surface { position: fixed; z-index: 20; top: 180px; left: 50%; width: min(400px, calc(100vw - 32px)); transform: translateX(-50%); padding: 20px; border: 1px solid #bbb; border-radius: 12px; background: #fff; box-shadow: 0 18px 50px rgba(0,0,0,.24); }
    body[data-fixture-theme="dark"] { background: #000; color: #f5f5f5; }
    body[data-fixture-theme="dark"] .instagram-nav,
    body[data-fixture-theme="dark"] .fixture-dialog,
    body[data-fixture-theme="dark"] .fixture-thread,
    body[data-fixture-theme="dark"] .fixture-live-confirmation,
    body[data-fixture-theme="dark"] .fixture-native-surface { border-color: #363636; background: #121212; color: #f5f5f5; }
    body[data-fixture-theme="dark"] .profile button,
    body[data-fixture-theme="dark"] .fixture-thread [role="row"] { background: #262626; color: #f5f5f5; }
    body[data-fixture-theme="dark"] .fixture-thread [data-mine] { background: #1769aa; }
    body[data-fixture-theme="dark"] .fixture-dialog a { color: #f5f5f5; }
    body[data-fixture-theme="dark"] .post { background: #262626; }
    @media (max-width: 760px) {
      .instagram-shell { grid-template-columns: 1fr; }
      .instagram-nav { display: none; }
      main { width: 100%; padding: 28px 18px; }
      .profile { grid-template-columns: 80px 1fr; gap: 18px; }
      .avatar { width: 76px; height: 76px; }
      .stats { gap: 12px; font-size: 12px; }
      .fixture-dialog { right: 12px; bottom: 12px; left: 12px; width: auto; }
    }
  </style>
</head>
<body>
  <div class="instagram-shell">
    <aside class="instagram-nav"><strong>Instagram</strong><ul><li>Home</li><li>Search</li><li>Explore</li><li>Messages</li><li>Profile</li></ul></aside>
    <main>
      <header class="profile">
        <div class="avatar" aria-label="Profile photo"></div>
        <div>
          <div><h1>demo_creator</h1><button type="button">Following</button></div>
          <div class="stats"><span><b>126</b> posts</span><span><b>8,420</b> followers</span><span><b>531</b> following</span></div>
          <strong>Demo Creator</strong><p>Runtime fixture for the Insta AIO extension overlay.</p>
        </div>
      </header>
      <section class="feed-grid" aria-label="Posts"><div class="post"></div><div class="post"></div><div class="post"></div><div class="post"></div><div class="post"></div><div class="post"></div></section>
    </main>
  </div>
  <section class="fixture-dialog" role="dialog" aria-label="Following">
    <h2>Following</h2>
    <a href="/alpha.friend/">alpha.friend</a>
    <a href="/bravo_creator/">bravo_creator</a>
    <a href="/charlie.studio/">charlie.studio</a>
  </section>

  <script nonce="insta-aio-overlay-qa">
    const FixtureNativeDate = Date;
    const fixtureClockStartedAt = FixtureNativeDate.now();
    const fixtureClockOrigin = FixtureNativeDate.parse('2026-08-02T17:00:00.000Z');
    class FixtureDate extends FixtureNativeDate {
      constructor(...argumentsList) {
        super(...(argumentsList.length
          ? argumentsList
          : [fixtureClockOrigin + (FixtureNativeDate.now() - fixtureClockStartedAt)]));
      }

      static now() {
        return fixtureClockOrigin + (FixtureNativeDate.now() - fixtureClockStartedAt);
      }
    }
    globalThis.Date = FixtureDate;

    const fixtureSearch = new URLSearchParams(location.search);
    const fixtureMode = fixtureSearch.get('mode');
    const fixtureTheme = fixtureSearch.get('theme') === 'dark' ? 'dark' : 'light';
    document.body.dataset.fixtureTheme = fixtureTheme;
    const fixtureLiveMode = fixtureMode === 'live-follow' || fixtureMode === 'live-unfollow';
    const fixtureLiveDmMode = fixtureMode === 'messages-live';
    const fixtureAccountIntentMode = fixtureLiveMode || [
      'qa-account-ready',
      'qa-account-armed',
      'qa-account-expiring',
      'qa-native-dialog',
    ].includes(fixtureMode);
    const fixtureDmIntentMode = [
      'qa-messages-ready',
      'qa-messages-wrong',
      'qa-messages-armed',
    ].includes(fixtureMode);
    const fixtureExactDmMode = fixtureMode === 'messages-exact'
      || fixtureLiveDmMode
      || fixtureDmIntentMode;
    const fixtureMessageMode = fixtureMode === 'messages' || fixtureExactDmMode;
    const fixtureListMode = ['qa-followers-first', 'qa-following-repeat'].includes(fixtureMode);
    if (fixtureLiveMode || fixtureAccountIntentMode || fixtureMessageMode || (
      fixtureMode?.startsWith('qa-') && !fixtureListMode
    )) {
      document.querySelector('.fixture-dialog').hidden = true;
    }
    if (fixtureListMode) {
      const listType = fixtureMode === 'qa-followers-first' ? 'Followers' : 'Following';
      const dialog = document.querySelector('.fixture-dialog');
      dialog.setAttribute('aria-label', listType);
      dialog.querySelector('h2').textContent = listType;
    }
    if (fixtureMessageMode) {
      history.replaceState({}, '', fixtureExactDmMode ? '/direct/t/123/' : '/direct/t/fixture_conversation/');
      document.querySelector('.fixture-dialog').hidden = true;
      document.querySelector('main').innerHTML = `
        <section class="fixture-thread" ${fixtureExactDmMode ? 'data-pagelet="IGDMessagesList"' : ''}>
          <header><h1>studio_friend</h1></header>
          <div role="row" ${fixtureExactDmMode ? 'data-message-id="received-1" data-timestamp-ms="1700000000000" data-sent-by-me="false"' : ''}><div ${fixtureExactDmMode ? 'data-insta-aio-message-content' : ''} dir="auto">Did you see the draft?</div></div>
          <div role="row" data-mine ${fixtureExactDmMode ? 'data-message-id="sent-1" data-timestamp-ms="1700000000100" data-sent-by-me="true"' : ''}>
            <div ${fixtureExactDmMode ? 'data-insta-aio-message-content' : ''} dir="auto">Yes — reviewing it now.</div>
            ${fixtureLiveDmMode ? '<button type="button" id="fixture-dm-action" aria-label="See more options for message" aria-haspopup="menu" aria-controls="fixture-dm-menu">More</button>' : ''}
          </div>
          <div role="row" ${fixtureExactDmMode ? 'data-message-id="received-2" data-timestamp-ms="1700000000200" data-sent-by-me="false"' : ''}><div ${fixtureExactDmMode ? 'data-insta-aio-message-content' : ''} dir="auto">Perfect, thank you.</div></div>
        </section>`;
    } else {
      history.replaceState({}, '', '/demo_creator/');
    }
    const fixtureProfileButton = document.querySelector('.profile button');
    globalThis.fixtureClickCount = 0;
    if (fixtureProfileButton && ['live-follow', 'qa-profile-not-following'].includes(fixtureMode)) {
      fixtureProfileButton.textContent = 'Follow';
    }
    if (fixtureMode === 'qa-profile-ambiguous') {
      const duplicate = document.createElement('button');
      duplicate.type = 'button';
      duplicate.textContent = 'Follow';
      fixtureProfileButton.parentElement.append(duplicate);
    }
    if (fixtureMode === 'live-follow') {
      fixtureProfileButton.addEventListener('click', () => {
        globalThis.fixtureClickCount += 1;
        fixtureProfileButton.textContent = 'Following';
      });
    }
    if (fixtureMode === 'live-unfollow') {
      fixtureProfileButton.addEventListener('click', () => {
        globalThis.fixtureClickCount += 1;
        const dialog = document.createElement('section');
        dialog.className = 'fixture-live-confirmation';
        dialog.setAttribute('role', 'dialog');
        dialog.innerHTML = '<p>Unfollow demo_creator?</p><button type="button">Unfollow</button>';
        dialog.querySelector('button').addEventListener('click', () => {
          globalThis.fixtureClickCount += 1;
          fixtureProfileButton.textContent = 'Follow';
          dialog.remove();
        });
        document.body.append(dialog);
      }, { once: true });
    }
    globalThis.fixtureDmClickCount = 0;
    if (fixtureLiveDmMode) {
      const targetRow = document.querySelector('[data-message-id="sent-1"]');
      const actionControl = document.querySelector('#fixture-dm-action');
      actionControl.addEventListener('click', () => {
        globalThis.fixtureDmClickCount += 1;
        const menu = document.createElement('section');
        menu.id = 'fixture-dm-menu';
        menu.setAttribute('role', 'menu');
        menu.setAttribute('aria-labelledby', actionControl.id);
        menu.innerHTML = '<button type="button" role="menuitem" id="fixture-dm-unsend-choice" aria-controls="fixture-dm-confirmation">Unsend</button>';
        const choice = menu.querySelector('#fixture-dm-unsend-choice');
        choice.addEventListener('click', () => {
          globalThis.fixtureDmClickCount += 1;
          const dialog = document.createElement('section');
          dialog.id = 'fixture-dm-confirmation';
          dialog.setAttribute('role', 'dialog');
          dialog.setAttribute('aria-labelledby', choice.id);
          dialog.innerHTML = '<p>Unsend this message?</p><button type="button">Unsend</button>';
          dialog.querySelector('button').addEventListener('click', () => {
            globalThis.fixtureDmClickCount += 1;
            targetRow.remove();
            menu.remove();
            dialog.remove();
          }, { once: true });
          document.body.append(dialog);
        }, { once: true });
        document.body.append(menu);
      }, { once: true });
      const targetText = targetRow.querySelector('[data-insta-aio-message-content]').textContent.trim();
      let targetHash = 0x811c9dc5;
      for (let index = 0; index < targetText.length; index += 1) {
        targetHash ^= targetText.charCodeAt(index);
        targetHash = Math.imul(targetHash, 0x01000193);
      }
      globalThis.fixtureDmItem = {
        conversationId: 'inbox/studio_friend_123',
        contentDigest: (targetHash >>> 0).toString(16).padStart(8, '0'),
        messageId: 'sent-1',
        sentByMe: true,
        timestamp: 1700000000100,
      };
    }
    if (fixtureExactDmMode && !globalThis.fixtureDmItem) {
      const targetRow = document.querySelector('[data-message-id="sent-1"]');
      const targetText = targetRow.querySelector('[data-insta-aio-message-content]').textContent.trim();
      let targetHash = 0x811c9dc5;
      for (let index = 0; index < targetText.length; index += 1) {
        targetHash ^= targetText.charCodeAt(index);
        targetHash = Math.imul(targetHash, 0x01000193);
      }
      globalThis.fixtureDmItem = {
        conversationId: 'inbox/studio_friend_123',
        contentDigest: (targetHash >>> 0).toString(16).padStart(8, '0'),
        messageId: 'sent-1',
        sentByMe: true,
        timestamp: 1700000000100,
      };
    }
    if (fixtureMode === 'qa-session-expired') {
      history.replaceState({}, '', '/accounts/login/');
      const input = document.createElement('input');
      input.name = 'username';
      input.setAttribute('aria-label', 'Instagram username');
      document.querySelector('main').prepend(input);
    }
    if (fixtureMode === 'qa-session-challenge') {
      history.replaceState({}, '', '/challenge/');
    }
    if (fixtureMode === 'qa-session-rate-limit') {
      document.querySelector('main').append(' Please wait a few minutes before you try again.');
    }
    if (fixtureMode === 'qa-session-action-blocked') {
      document.querySelector('main').append(' We restrict certain activity to protect our community.');
    }
    const fixtureAction = fixtureMode === 'live-follow' ? 'follow' : 'unfollow';
    const fixtureIntent = fixtureAccountIntentMode ? {
      action: fixtureAction,
      confirmedAt: new Date().toISOString(),
      expiresAt: new Date(Date.now() + 10 * 60 * 1000).toISOString(),
      itemId: 'fixture-action-item-1',
      jobId: 'fixture-live-job-1',
      username: 'demo_creator',
    } : null;
    const fixtureDmIntent = fixtureDmIntentMode ? {
      armCode: 'FIXTURE7',
      confirmedAt: new Date().toISOString(),
      contentDigest: globalThis.fixtureDmItem.contentDigest,
      conversationId: fixtureMode === 'qa-messages-wrong'
        ? 'inbox/not_this_thread'
        : globalThis.fixtureDmItem.conversationId,
      expiresAt: new Date(Date.now() + 10 * 60 * 1000).toISOString(),
      itemId: 'fixture-dm-item-1',
      jobId: 'fixture-dm-job-1',
      messageId: globalThis.fixtureDmItem.messageId,
      timestamp: globalThis.fixtureDmItem.timestamp,
    } : null;
    const fixturePairingMode = fixtureSearch.get('pairing') || 'action';
    const fixturePairings = fixturePairingMode === 'none' ? [] : [{
      origin: 'http://127.0.0.1:4173',
      permissions: fixturePairingMode === 'read' ? ['read'] : ['read', 'action'],
      pairedAt: '2026-07-31T12:00:00.000Z',
    }];
    const fixtureSection = ['now', 'capture', 'queue', 'messages', 'workspace']
      .includes(fixtureSearch.get('section'))
      ? fixtureSearch.get('section')
      : 'now';
    const fixtureFloatingLayout = fixtureSearch.get('layout') === 'floating';
    const fixturePreferences = fixtureSearch.has('open') || fixtureSearch.has('section')
      ? {
        schemaVersion: fixtureFloatingLayout ? 3 : 2,
        open: fixtureSearch.get('open') !== 'false',
        section: fixtureSection,
        dock: fixtureSearch.get('dock') === 'left' ? 'left' : 'right',
        width: ['compact', 'standard', 'wide'].includes(fixtureSearch.get('width'))
          ? fixtureSearch.get('width')
          : 'standard',
        theme: fixtureTheme,
        density: fixtureSearch.get('density') === 'compact' ? 'compact' : 'comfortable',
        firstRunComplete: true,
        ...(fixtureFloatingLayout ? {
          opacity: Number(fixtureSearch.get('opacity')),
          panelHeight: Number(fixtureSearch.get('panelHeight')),
          panelWidth: Number(fixtureSearch.get('panelWidth')),
          position: {
            x: Number(fixtureSearch.get('positionX')),
            y: Number(fixtureSearch.get('positionY')),
          },
        } : {}),
      }
      : null;
    const fixtureQueueUsername = fixtureMode === 'qa-profile-not-following'
      ? 'someone_else'
      : 'demo_creator';
    const fixtureQueue = fixtureSearch.get('queue') === 'none' ? [] : [{
      id: 'fixture-queue-1',
      account: { username: fixtureQueueUsername, displayName: 'Demo Creator', source: 'fixture' },
      action: fixtureAction,
      status: 'ready',
      reason: 'fixture review',
      scheduledFor: '2026-07-31T12:00:00.000Z',
    }];
    const fixtureAccountArm = ['qa-account-armed', 'qa-native-dialog', 'qa-account-expiring']
      .includes(fixtureMode)
      ? {
        action: fixtureAction,
        armedAt: new Date().toISOString(),
        expiresAt: new Date(Date.now() + (fixtureMode === 'qa-account-expiring' ? 700 : 90_000)).toISOString(),
        itemId: fixtureIntent.itemId,
        jobId: fixtureIntent.jobId,
        username: fixtureIntent.username,
      }
      : null;
    const fixtureDmArm = fixtureMode === 'qa-messages-armed' ? {
      armedAt: new Date().toISOString(),
      conversationId: fixtureDmIntent.conversationId,
      expiresAt: new Date(Date.now() + 90_000).toISOString(),
      itemId: fixtureDmIntent.itemId,
      jobId: fixtureDmIntent.jobId,
      messageId: fixtureDmIntent.messageId,
    } : null;
    const fixtureStorage = {
      bridgePairings: fixturePairings,
      pendingJobs: [],
      pendingLiveIntent: fixtureIntent,
      pendingDmIntent: fixtureDmIntent,
      liveArm: fixtureAccountArm,
      dmArm: fixtureDmArm,
      batchArm: null,
      batchRun: null,
      batchLimits: {
        dailyActionLimit: 100,
        dailyDmLimit: 50,
        minDelayMs: 4000,
        maxDelayMs: 11000,
      },
      ...(fixturePreferences ? {
        [fixtureFloatingLayout ? 'instaAioOverlayPreferencesV3' : 'instaAioOverlayPreferencesV2']:
          fixturePreferences,
      } : {}),
      ...(fixtureMode === 'qa-following-repeat' ? {
        instaAioOverlayCaptureDraftV1: {
          schemaVersion: 1,
          kind: 'insta-aio-visible-list',
          listType: 'following',
          capturedAt: '2026-07-31T12:00:00.000Z',
          following: [
            { username: 'alpha.friend', displayName: '', source: 'extension-visible-dom' },
            { username: 'older_account', displayName: '', source: 'extension-visible-dom' },
          ],
        },
      } : {}),
      instaAioOverlayManualQueueV1: {
        importedAt: '2026-07-31T12:00:00.000Z',
        queue: fixtureQueue,
      },
    };
    globalThis.fixtureStorage = fixtureStorage;
    if (fixtureMode === 'qa-native-dialog') {
      const dialog = document.createElement('section');
      dialog.className = 'fixture-native-surface';
      dialog.setAttribute('role', 'dialog');
      dialog.innerHTML = '<p>Unfollow demo_creator?</p><button type="button">Unfollow</button>';
      document.body.append(dialog);
    }
    const storageListeners = [];
    const runtimeListeners = [];
    if (fixtureSearch.get('shadow') !== 'closed') {
      globalThis.__instaAioOverlayTestOpenShadow = true;
    }
    globalThis.chrome = {
      runtime: {
        lastError: null,
        getManifest: () => ({ version: '0.9.0' }),
        onMessage: { addListener: (listener) => runtimeListeners.push(listener) },
        sendMessage: (request, callback) => {
          if (request.kind === 'insta-aio-overlay-state') {
            callback({ state: {
              controlledAccountActionsAvailable: true,
              controlledDmUnsendAvailable: true,
              dmArm: fixtureStorage.dmArm,
              extensionVersion: '0.9.0',
              liveExecutionEnabled: Boolean(fixtureStorage.liveArm || fixtureStorage.dmArm),
              liveArm: fixtureStorage.liveArm,
              pairings: fixtureStorage.bridgePairings,
              pendingDmIntent: fixtureStorage.pendingDmIntent,
              pendingLiveIntent: fixtureStorage.pendingLiveIntent,
              recentRuns: [{
                kind: 'insta-aio-reviewed-action-job',
                jobId: 'fixture-job-1',
                receivedAt: '2026-07-31T12:04:00.000Z',
                mode: 'dry-run',
                status: 'dry-run-complete',
                stopReason: null,
                results: [{ username: 'demo_creator', action: 'unfollow', status: 'resolved-no-click' }],
              }],
            } });
            return;
          }
          if (request.kind === 'insta-aio-arm-account-action') {
            const expectedPhrase = `ARM ${fixtureAction.toUpperCase()} @demo_creator`;
            if (request.phrase !== expectedPhrase) {
              callback({ error: 'live-arm-phrase-mismatch' });
              return;
            }
            fixtureStorage.liveArm = {
              action: fixtureAction,
              armedAt: new Date().toISOString(),
              expiresAt: new Date(Date.now() + 90 * 1000).toISOString(),
              itemId: fixtureIntent.itemId,
              jobId: fixtureIntent.jobId,
              username: fixtureIntent.username,
            };
            callback({ state: {
              controlledAccountActionsAvailable: true,
              controlledDmUnsendAvailable: true,
              dmArm: fixtureStorage.dmArm,
              extensionVersion: '0.9.0',
              liveExecutionEnabled: true,
              liveArm: fixtureStorage.liveArm,
              pairings: fixtureStorage.bridgePairings,
              pendingDmIntent: fixtureStorage.pendingDmIntent,
              pendingLiveIntent: fixtureStorage.pendingLiveIntent,
              recentRuns: [],
            } });
            return;
          }
          if (request.kind === 'insta-aio-cancel-account-action') {
            fixtureStorage.pendingLiveIntent = null;
            fixtureStorage.liveArm = null;
            callback({ state: {
              controlledAccountActionsAvailable: true,
              controlledDmUnsendAvailable: true,
              dmArm: fixtureStorage.dmArm,
              extensionVersion: '0.9.0',
              liveExecutionEnabled: false,
              liveArm: null,
              pairings: fixtureStorage.bridgePairings,
              pendingDmIntent: fixtureStorage.pendingDmIntent,
              pendingLiveIntent: null,
              recentRuns: [],
            } });
            return;
          }
          if (request.kind === 'insta-aio-arm-dm-unsend') {
            const expectedPhrase = `ARM UNSEND ${fixtureDmIntent.armCode}`;
            if (request.phrase !== expectedPhrase) {
              callback({ error: 'dm-live-arm-phrase-mismatch' });
              return;
            }
            fixtureStorage.dmArm = {
              armedAt: new Date().toISOString(),
              conversationId: fixtureDmIntent.conversationId,
              expiresAt: new Date(Date.now() + 90 * 1000).toISOString(),
              itemId: fixtureDmIntent.itemId,
              jobId: fixtureDmIntent.jobId,
              messageId: fixtureDmIntent.messageId,
            };
            callback({ state: {
              controlledAccountActionsAvailable: true,
              controlledDmUnsendAvailable: true,
              dmArm: fixtureStorage.dmArm,
              extensionVersion: '0.9.0',
              liveExecutionEnabled: true,
              liveArm: fixtureStorage.liveArm,
              pairings: fixtureStorage.bridgePairings,
              pendingDmIntent: fixtureStorage.pendingDmIntent,
              pendingLiveIntent: fixtureStorage.pendingLiveIntent,
              recentRuns: [],
            } });
            return;
          }
          if (request.kind === 'insta-aio-cancel-dm-unsend') {
            fixtureStorage.pendingDmIntent = null;
            fixtureStorage.dmArm = null;
            callback({ state: {
              controlledAccountActionsAvailable: true,
              controlledDmUnsendAvailable: true,
              dmArm: null,
              extensionVersion: '0.9.0',
              liveExecutionEnabled: Boolean(fixtureStorage.liveArm),
              liveArm: fixtureStorage.liveArm,
              pairings: fixtureStorage.bridgePairings,
              pendingDmIntent: null,
              pendingLiveIntent: fixtureStorage.pendingLiveIntent,
              recentRuns: [],
            } });
            return;
          }
          if (request.kind === 'insta-aio-batch-status') {
            callback({
              run: fixtureStorage.batchRun || null,
              arm: fixtureStorage.batchArm || null,
              limits: fixtureStorage.batchLimits,
            });
            return;
          }
          if (request.kind === 'insta-aio-arm-batch') {
            const expected = request.batchKind === 'dm'
              ? `ARM MASS UNSEND ${request.count}`
              : `ARM BATCH ${String(request.action || '').toUpperCase()} ${request.count}`;
            if (request.phrase !== expected) {
              callback({ error: 'batch-arm-phrase-mismatch' });
              return;
            }
            fixtureStorage.batchArm = {
              kind: request.batchKind,
              action: request.action,
              count: request.count,
            };
            callback({ arm: fixtureStorage.batchArm });
            return;
          }
          if (request.kind === 'insta-aio-start-batch') {
            if (!fixtureStorage.batchArm) {
              callback({ error: 'batch-arm-required' });
              return;
            }
            const items = request.items || [];
            fixtureStorage.batchRun = {
              id: 'fixture-run',
              kind: request.batchKind,
              action: fixtureStorage.batchArm.action,
              status: 'running',
              total: items.length,
              completed: 1,
              failed: 0,
              skipped: 0,
              currentLabel: request.batchKind === 'dm'
                ? (items[1]?.preview || 'message')
                : `@${items[1]?.username || items[0]?.username || ''}`,
              nextActionAt: new Date(Date.now() + 6000).toISOString(),
              stopReason: null,
              results: items.slice(0, 1).map((item, index) => ({
                index,
                label: request.batchKind === 'dm' ? item.messageId : item.username,
                status: 'completed',
                reason: null,
              })),
            };
            fixtureStorage.batchArm = null;
            callback({ run: fixtureStorage.batchRun });
            return;
          }
          if (request.kind === 'insta-aio-abort-batch') {
            if (fixtureStorage.batchRun) {
              fixtureStorage.batchRun.status = 'aborted';
              fixtureStorage.batchRun.stopReason = 'stopped-by-user';
              fixtureStorage.batchRun.nextActionAt = null;
            }
            callback({ run: fixtureStorage.batchRun });
            return;
          }
          if (request.kind === 'insta-aio-batch-limits') {
            fixtureStorage.batchLimits = {
              ...fixtureStorage.batchLimits,
              ...request.limits,
            };
            callback({ limits: fixtureStorage.batchLimits });
            return;
          }
          callback({});
        },
      },
      storage: {
        local: {
          get: (keys, callback) => {
            const list = Array.isArray(keys) ? keys : [keys];
            callback(Object.fromEntries(list.map((key) => [key, fixtureStorage[key]])));
          },
          set: (value, callback = () => {}) => {
            const changes = {};
            for (const [key, next] of Object.entries(value)) {
              changes[key] = { oldValue: fixtureStorage[key], newValue: next };
              fixtureStorage[key] = next;
            }
            callback();
            for (const listener of storageListeners) listener(changes, 'local');
          },
          remove: (key, callback = () => {}) => {
            const oldValue = fixtureStorage[key];
            delete fixtureStorage[key];
            callback();
            for (const listener of storageListeners) listener({ [key]: { oldValue } }, 'local');
          },
        },
        onChanged: {
          addListener: (listener) => storageListeners.push(listener),
          removeListener: (listener) => {
            const index = storageListeners.indexOf(listener);
            if (index >= 0) storageListeners.splice(index, 1);
          },
        },
      },
    };
    globalThis.fixtureSendContentMessage = (request) => new Promise((resolve) => {
      let waiting = false;
      for (const listener of runtimeListeners) {
        const result = listener(request, {}, resolve);
        if (result === true) waiting = true;
      }
      if (!waiting) queueMicrotask(() => resolve(undefined));
    });
  </script>
