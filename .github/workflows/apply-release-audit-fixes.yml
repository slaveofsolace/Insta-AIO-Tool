name: Apply release audit hardening

on:
  push:
    branches: [codex/overlay-ui-controls-20260805]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/overlay-ui-controls-20260805
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply reviewed fixes
        run: |
          node scripts/apply-release-audit-fixes.mjs
          node scripts/build-userscript.mjs
      - name: Verify source and focused browser acceptance
        env:
          INSTA_AIO_ACCEPTANCE_NO_SANDBOX: "1"
        run: |
          pnpm run assemble
          find desktop extension scripts src tests userscripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          pnpm test
          xvfb-run --auto-servernum pnpm run qa:extension
      - name: Commit reviewed release changes
        run: |
          rm scripts/apply-release-audit-fixes.mjs
          rm .github/workflows/apply-release-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+slaveofsolace@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden the 0.9.2 release"
          git push origin HEAD:codex/overlay-ui-controls-20260805
