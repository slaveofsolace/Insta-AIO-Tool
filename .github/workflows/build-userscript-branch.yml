name: Build userscript branch artifact

on:
  push:
    branches: [fix/thread-unsend-instagram-ui]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/thread-unsend-instagram-ui
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate userscript
        run: node scripts/build-userscript.mjs
      - name: Commit generated file
        run: |
          if git diff --quiet -- userscripts/insta-aio-companion.user.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscripts/insta-aio-companion.user.js
          git commit -m "build: regenerate Tampermonkey bundle"
          git push origin HEAD:fix/thread-unsend-instagram-ui
