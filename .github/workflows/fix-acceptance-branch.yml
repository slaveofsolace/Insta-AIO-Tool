name: Fix toolbox acceptance copy

on:
  push:
    branches: [fix/thread-unsend-instagram-ui]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/thread-unsend-instagram-ui
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Apply bounded copy correction
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'extension/action-labels.js';
          const before = "setText('mode-label', 'Runs locally in this tab');";
          const after = "setText('mode-label', 'Live actions enabled in this tab');";
          const source = await readFile(path, 'utf8');
          if (!source.includes(before)) throw new Error('Expected mode label was not found.');
          await writeFile(path, source.replace(before, after));
          NODE
          node scripts/build-userscript.mjs
      - name: Commit corrected source and bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/action-labels.js userscripts/insta-aio-companion.user.js
          git commit -m "fix: clarify enabled toolbox actions"
          git push origin HEAD:fix/thread-unsend-instagram-ui
