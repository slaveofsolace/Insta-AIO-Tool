name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Assemble browser module
        run: pnpm run assemble
      - name: Syntax checks
        run: |
          find desktop extension scripts src tests userscripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Core tests
        run: pnpm test
      - name: Full dependency audit
        run: pnpm audit --audit-level high
      - name: Large import benchmark
        run: pnpm run benchmark:zip
      - name: Production extension browser acceptance
        env:
          # The package-managed Electron sandbox is not root-owned on hosted runners.
          INSTA_TOOLBOX_ACCEPTANCE_NO_SANDBOX: "1"
        run: xvfb-run --auto-servernum pnpm run qa:extension
      - name: Install Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable
      - name: Real Chrome extension pairing acceptance
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Ubuntu hosted runners disable the user-namespace sandbox through AppArmor.
          INSTA_TOOLBOX_CHROME_ACCEPTANCE_NO_SANDBOX: "1"
        run: xvfb-run --auto-servernum pnpm run qa:chrome
      - name: Upload tested browser companions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-toolbox-browser-companions-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/Insta-Toolbox-Extension-*.zip
            userscripts/insta-toolbox.user.js
          if-no-files-found: error
          retention-days: 7
      - name: Upload tested web app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-toolbox-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/insta-toolbox-web-*.zip
          if-no-files-found: error
          retention-days: 7

  overlay-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify reviewed Windows overlay baselines
        env:
          # Native text/scrollbar rasterization differs slightly across Windows runner images.
          INSTA_TOOLBOX_OVERLAY_QA_CI_WINDOWS_RASTER_TOLERANCE: "1"
        run: pnpm run qa:overlay:check
      - name: Verify reviewed Windows PWA baselines
        env:
          # Keep CI raster output exact without replacing the developer-machine baseline.
          INSTA_TOOLBOX_BROWSER_QA_BASELINE_VARIANT: github-actions-windows-2025-vs2026
        run: pnpm run qa:browser:check
      - name: Upload failed Windows rendering evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendering-windows-failure-${{ github.sha }}
          path: |
            test-results/overlay-qa/actual/win32
            test-results/overlay-qa/runner.log
            test-results/browser-qa/win32
            test-results/browser-qa/runner.log
          if-no-files-found: warn
          retention-days: 3

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows NSIS installer
        run: pnpm run dist:win
      - name: Verify packaged Windows archive contents
        run: pnpm run verify:desktop-archive
      - name: Smoke-test unpacked Windows application
        shell: pwsh
        run: |
          $smokeParent = Join-Path ([System.IO.Path]::GetTempPath()) 'insta-toolbox-desktop-smoke-parent'
          New-Item -ItemType Directory -Path $smokeParent -Force | Out-Null
          $env:INSTA_TOOLBOX_DESKTOP_SMOKE_PARENT = (Resolve-Path -LiteralPath $smokeParent).Path
          $env:INSTA_TOOLBOX_DESKTOP_SMOKE_TEST = '1'
          try {
            $smokeExecutable = (Resolve-Path -LiteralPath 'dist/desktop/win-unpacked/Insta Toolbox.exe').Path
            $smokeProcess = Start-Process -FilePath $smokeExecutable -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
            if (-not $smokeProcess.WaitForExit(30000)) {
              try { $smokeProcess.Kill($true) } catch {}
              throw 'Desktop smoke test timed out after 30 seconds.'
            }
            if ($smokeProcess.ExitCode -ne 0) {
              throw "Desktop smoke test exited with $($smokeProcess.ExitCode)."
            }
          } finally {
            Remove-Item Env:INSTA_TOOLBOX_DESKTOP_SMOKE_TEST -ErrorAction SilentlyContinue
          }
      - name: Verify Windows installer artifact
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedInstaller = "Insta-Toolbox-Setup-$version.exe"
          $installers = @(Get-ChildItem -Path dist/desktop -Filter *.exe -File)
          $blockmaps = @(Get-ChildItem -Path dist/desktop -Filter *.blockmap -File)
          if ($installers.Count -ne 1 -or $installers[0].Name -ne $expectedInstaller) {
            throw "Expected exactly $expectedInstaller. Found: $($installers.Name -join ', ')"
          }
          if ($blockmaps.Count -ne 0) {
            throw "Updater blockmaps are not supported. Found: $($blockmaps.Name -join ', ')"
          }
          Write-Host $installers[0].FullName
      - name: Verify NSIS install, launch, and uninstall lifecycle
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "dist/desktop/Insta-Toolbox-Setup-$version.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "insta-toolbox-nsis-$version"
          $installerProcess = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -PassThru -WindowStyle Hidden
          if (-not $installerProcess.WaitForExit(120000)) {
            try { $installerProcess.Kill($true) } catch {}
            throw 'NSIS installation timed out after 120 seconds.'
          }
          if ($installerProcess.ExitCode -ne 0) {
            throw "NSIS installation exited with $($installerProcess.ExitCode)."
          }
          $installedExecutable = Join-Path $installRoot 'Insta Toolbox.exe'
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "Installed application was not found at $installedExecutable."
          }
          Add-Type -AssemblyName System.Drawing
          $embeddedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($installedExecutable)
          if ($null -eq $embeddedIcon) {
            throw 'Installed application has no extractable Windows icon.'
          }
          $iconBitmap = $embeddedIcon.ToBitmap()
          try {
            if ($iconBitmap.Width -lt 16 -or $iconBitmap.Height -lt 16) {
              throw "Installed application icon is unexpectedly small: $($iconBitmap.Width)x$($iconBitmap.Height)."
            }
            $accentPixels = 0
            for ($x = 0; $x -lt $iconBitmap.Width; $x += 1) {
              for ($y = 0; $y -lt $iconBitmap.Height; $y += 1) {
                $pixel = $iconBitmap.GetPixel($x, $y)
                if ($pixel.R -ge 160 -and $pixel.R -le 210 -and $pixel.G -ge 35 -and $pixel.G -le 100 -and $pixel.B -ge 70 -and $pixel.B -le 140) {
                  $accentPixels += 1
                }
              }
            }
            if ($accentPixels -lt 8) {
              throw 'Installed application icon does not contain the reviewed Insta Toolbox accent mark.'
            }
          } finally {
            $iconBitmap.Dispose()
            $embeddedIcon.Dispose()
          }
          $smokeParent = Join-Path ([System.IO.Path]::GetTempPath()) 'insta-toolbox-desktop-smoke-parent'
          New-Item -ItemType Directory -Path $smokeParent -Force | Out-Null
          $env:INSTA_TOOLBOX_DESKTOP_SMOKE_PARENT = (Resolve-Path -LiteralPath $smokeParent).Path
          $env:INSTA_TOOLBOX_DESKTOP_SMOKE_TEST = '1'
          try {
            $smokeProcess = Start-Process -FilePath $installedExecutable -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
            if (-not $smokeProcess.WaitForExit(30000)) {
              try { $smokeProcess.Kill($true) } catch {}
              throw 'Installed application smoke test timed out after 30 seconds.'
            }
            if ($smokeProcess.ExitCode -ne 0) {
              throw "Installed application smoke test exited with $($smokeProcess.ExitCode)."
            }
          } finally {
            Remove-Item Env:INSTA_TOOLBOX_DESKTOP_SMOKE_TEST -ErrorAction SilentlyContinue
          }
          $uninstallers = @(Get-ChildItem -LiteralPath $installRoot -Filter 'Uninstall*.exe' -File)
          if ($uninstallers.Count -ne 1) {
            throw "Expected one NSIS uninstaller. Found: $($uninstallers.Name -join ', ')"
          }
          $uninstallerProcess = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -PassThru -WindowStyle Hidden
          if (-not $uninstallerProcess.WaitForExit(120000)) {
            try { $uninstallerProcess.Kill($true) } catch {}
            throw 'NSIS uninstall timed out after 120 seconds.'
          }
          if ($uninstallerProcess.ExitCode -ne 0) {
            throw "NSIS uninstall exited with $($uninstallerProcess.ExitCode)."
          }
          for ($attempt = 0; $attempt -lt 30 -and (Test-Path -LiteralPath $installedExecutable); $attempt += 1) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $installedExecutable) {
            throw 'NSIS uninstall left the installed application behind.'
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-toolbox-windows-${{ github.sha }}
          path: |
            dist/desktop/*.exe
          if-no-files-found: error
          retention-days: 7

  package-macos:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run production extension browser acceptance
        run: pnpm run qa:extension
      - name: Build macOS DMG and ZIP
        run: pnpm run dist:mac
      - name: Verify packaged macOS archive contents
        run: pnpm run verify:desktop-archive
      - name: Verify universal signed macOS package lifecycle
        run: pnpm run qa:mac-package
      - name: Upload verified macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-toolbox-macos-${{ github.sha }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
          if-no-files-found: error
          retention-days: 7

  release-checksums:
    needs: [test, overlay-windows, package-windows, package-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download tested browser companions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: insta-toolbox-browser-companions-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Download tested web app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: insta-toolbox-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
      - name: Download verified Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: insta-toolbox-windows-${{ github.sha }}
          path: dist/desktop
      - name: Download verified macOS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: insta-toolbox-macos-${{ github.sha }}
          path: dist/desktop
      - name: Verify release archives and generate checksums
        run: node scripts/generate-release-checksums.mjs
      - name: Upload combined release checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insta-toolbox-checksums-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
