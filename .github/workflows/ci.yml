name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble browser module
        run: npm run assemble
      - name: Syntax checks
        run: |
          find src userscripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Core tests
        run: npm test
