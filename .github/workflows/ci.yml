name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Assemble browser module
        run: pnpm run assemble
      - name: Syntax checks
        run: |
          find desktop extension scripts src tests userscripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Core tests
        run: pnpm test
      - name: Production extension browser acceptance
        env:
          # The package-managed Electron sandbox is not root-owned on hosted runners.
          INSTA_AIO_ACCEPTANCE_NO_SANDBOX: "1"
        run: xvfb-run --auto-servernum pnpm run qa:extension
      - name: Install Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable
      - name: Real Chrome extension pairing acceptance
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Ubuntu hosted runners disable the user-namespace sandbox through AppArmor.
          INSTA_AIO_CHROME_ACCEPTANCE_NO_SANDBOX: "1"
        run: xvfb-run --auto-servernum pnpm run qa:chrome
      - name: Upload tested browser companions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: insta-aio-browser-companions-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/insta-aio-companion-*.zip
            userscripts/insta-aio-companion.user.js
          if-no-files-found: error
          retention-days: 7

  overlay-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify reviewed Windows overlay baselines
        env:
          # Native text/scrollbar rasterization differs slightly across Windows runner images.
          INSTA_AIO_OVERLAY_QA_CI_WINDOWS_RASTER_TOLERANCE: "1"
        run: pnpm run qa:overlay:check
      - name: Upload failed overlay comparison evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overlay-windows-failure-${{ github.sha }}
          path: |
            test-results/overlay-qa/actual/win32
            test-results/overlay-qa/runner.log
          if-no-files-found: warn
          retention-days: 3

  package-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows NSIS installer
        run: pnpm run dist:win
      - name: Verify Windows installer artifact
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist/desktop -Filter *.exe -File)
          if ($installers.Count -lt 1) {
            throw "No Windows installer was produced."
          }
          $installers | ForEach-Object { Write-Host $_.FullName }
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: insta-aio-windows-${{ github.sha }}
          path: dist/desktop/*.exe
          if-no-files-found: error
          retention-days: 7

  package-macos:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run production extension browser acceptance
        run: pnpm run qa:extension
      - name: Build macOS DMG and ZIP
        run: pnpm run dist:mac
      - name: Verify macOS package lifecycle
        run: pnpm run qa:mac-package
      - name: Upload verified macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: insta-aio-macos-${{ github.sha }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
          if-no-files-found: error
          retention-days: 7
