name: Release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run ID for the current main commit
        required: true
        type: string
      tag:
        description: Release tag, for example v3.1.4
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote tested main artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate successful main CI run
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "ci_run_id must be numeric" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be v<major>.<minor>.<patch>" >&2; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/ci.yml"
          test "$(jq -r .name <<<"$run_json")" = "CI"
          event="$(jq -r .event <<<"$run_json")"
          [[ "$event" = "push" || "$event" = "workflow_dispatch" ]]
          test "$(jq -r .head_branch <<<"$run_json")" = "main"
          test "$(jq -r .status <<<"$run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          sha="$(jq -r .head_sha <<<"$run_json")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$sha" = "$main_sha" || { echo "CI run is not for the current main commit" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the tested source identity
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.ci.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download tested browser companions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: insta-toolbox-browser-companions-${{ steps.ci.outputs.sha }}
          path: incoming/browser
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Download tested web app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: insta-toolbox-web-${{ steps.ci.outputs.sha }}
          path: incoming/web
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Download verified Windows packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: insta-toolbox-windows-${{ steps.ci.outputs.sha }}
          path: incoming/windows
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Download verified macOS packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: insta-toolbox-macos-${{ steps.ci.outputs.sha }}
          path: incoming/macos
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Download release checksums
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: insta-toolbox-checksums-${{ steps.ci.outputs.sha }}
          path: incoming/checksums
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Validate versions, filenames, and checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test "$version" = "3.1.4"
          mkdir -p release
          copy_exact() {
            local name="$1"
            mapfile -d '' matches < <(find incoming -type f -name "$name" -print0)
            test "${#matches[@]}" -eq 1 || { echo "Expected one $name, found ${#matches[@]}" >&2; exit 1; }
            cp -- "${matches[0]}" "release/$name"
          }
          copy_exact "insta-toolbox.user.js"
          copy_exact "Insta-Toolbox-Extension-$version.zip"
          copy_exact "insta-toolbox-web-$version.zip"
          copy_exact "Insta-Toolbox-Setup-$version.exe"
          copy_exact "Insta-Toolbox-$version-universal.dmg"
          copy_exact "Insta-Toolbox-$version-universal.zip"
          copy_exact "SHA256SUMS.txt"
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 7
          grep -Eq "^// @version[[:space:]]+$version[[:space:]]*$" release/insta-toolbox.user.js
          test "$(unzip -p "release/Insta-Toolbox-Extension-$version.zip" manifest.json | jq -r .version)" = "$version"
          test "$(unzip -p "release/insta-toolbox-web-$version.zip" insta-toolbox-web/VERSION.txt | tr -d '\r\n')" = "$version"
          (
            cd release
            test "$(wc -l < SHA256SUMS.txt)" -eq 6
            sha256sum --check --strict SHA256SUMS.txt
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM for promoted files
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release
          format: spdx-json
          output-file: release/Insta-Toolbox-${{ steps.assets.outputs.version }}.spdx.json
          upload-artifact: false

      - name: Add the SBOM to the checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum "Insta-Toolbox-${{ steps.assets.outputs.version }}.spdx.json" >> SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 7
          sha256sum --check --strict SHA256SUMS.txt

      - name: Attest promoted release files
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd # v3.2.0
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Publish tag and GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          release_notes="$(cat <<'EOF'
          DM Unsend now stops when you switch conversations. Pending waits are canceled so you can start a fresh run without refreshing. Includes the updated Tampermonkey script and fast-uri security fix.

          ## Distribution notes

          - The Windows installer is unsigned and may show a Microsoft SmartScreen warning.
          - The macOS packages are ad-hoc signed and are not Apple-notarized.
          - Automated CI does not claim current authenticated Instagram compatibility or a completed human screen-reader walkthrough. Consult the 3.1.4 acceptance record for any separately recorded manual evidence.
          EOF
          )"
          gh release create "$RELEASE_TAG" release/* \
            --target "${{ steps.ci.outputs.sha }}" \
            --title "Insta Toolbox ${{ steps.assets.outputs.version }}" \
            --generate-notes \
            --notes "$release_notes" \
            --latest
